<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eid Mubarak</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
<!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    // Tailwind Config
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            amiri: ['Amiri', 'serif'],
            raleway: ['Raleway', 'sans-serif'],
          },
          colors: {
            eid: {
              primary: '#10B981',
              secondary: '#8B5CF6',
              accent: '#F59E0B',
              dark: '#1F2937',
              light: '#F3F4F6',
            },
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Custom styles that can't be easily done with Tailwind */
    .gradient-text {
      background: linear-gradient(90deg, #10B981, #8B5CF6, #F59E0B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .firework {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px;
      animation: explode 1s ease-out forwards;
      opacity: 0;
    }
    
    @keyframes explode {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: scale(20);
        opacity: 0;
      }
    }
    
    .card-preview {
      transition: all 0.3s ease;
    }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #10B981;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #0e9f6e;
    }
    
    .dark ::-webkit-scrollbar-track {
      background: #374151;
    }
  </style>
</head>
<body class="font-raleway bg-eid-light dark:bg-eid-dark transition-colors duration-300">
  <div id="root"></div>
  
  <script type="text/babel">
    // Main App Component
    const App = () => {
      const [darkMode, setDarkMode] = React.useState(false);
      const [senderName, setSenderName] = React.useState('');
      const [fromName, setFromName] = React.useState('Uzair Mughal');
      const [activeSection, setActiveSection] = React.useState('home');
      
      // Get sender name from URL parameters on component mount
      React.useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from');
        
        if (fromParam) {
          setFromName(decodeURIComponent(fromParam.replace(/"/g, '')));
        }
        
        // Check user's preferred color scheme
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          setDarkMode(true);
        }
        
        // Add event listener for scroll to update active section
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
      
      // Update document body class when dark mode changes
      React.useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);
      
      // Create fireworks effect
      React.useEffect(() => {
        const createFirework = () => {
          const firework = document.createElement('div');
          firework.className = 'firework';
          
          // Random position
          const x = Math.random() * window.innerWidth;
          const y = Math.random() * window.innerHeight * 0.7; // Keep in top 70% of screen
          
          // Random color
          const colors = ['#10B981', '#8B5CF6', '#F59E0B', '#EF4444', '#3B82F6'];
          const color = colors[Math.floor(Math.random() * colors.length)];
          
          firework.style.left = `${x}px`;
          firework.style.top = `${y}px`;
          firework.style.boxShadow = `0 0 10px 2px ${color}`;
          
          document.body.appendChild(firework);
          
          // Remove firework after animation completes
          setTimeout(() => {
            document.body.removeChild(firework);
          }, 1000);
        };
        
        // Create fireworks at random intervals
        const fireworkInterval = setInterval(() => {
          if (Math.random() > 0.9) { 
            createFirework();
          }
        }, 800);
        
        return () => clearInterval(fireworkInterval);
      }, []);
      
      // Handle scroll to update active section
      const handleScroll = () => {
        const sections = ['home', 'greetings', 'card-maker', 'recipes'];
        
        for (const section of sections) {
          const element = document.getElementById(section);
          if (element) {
            const rect = element.getBoundingClientRect();
            if (rect.top <= 100 && rect.bottom >= 100) {
              setActiveSection(section);
              break;
            }
          }
        }
      };
      
      // Generate share link
      const generateShareLink = () => {
        if (!senderName.trim()) return;
        
        const baseUrl = window.location.href.split('?')[0];
        const shareLink = `${baseUrl}?from=${encodeURIComponent(senderName)}`;
        
        // Copy to clipboard
        navigator.clipboard.writeText(shareLink)
          .then(() => {
            alert('Share link copied to clipboard!');
          })
          .catch(err => {
            console.error('Failed to copy link: ', err);
            alert('Share link: ' + shareLink);
          });
      };
      
      // Smooth scroll to section
      const scrollToSection = (sectionId) => {
        const element = document.getElementById(sectionId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };
      
      return (
        <div className="min-h-screen">
          {/* Navbar */}
          <nav className="fixed top-0 left-0 right-0 bg-white dark:bg-eid-dark shadow-md z-50 transition-colors duration-300">
            <div className="container mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center">
                <div className="text-2xl font-amiri font-bold gradient-text">Eid Mubarak</div>
              </div>
              
              <div className="hidden md:flex space-x-6">
                <button 
                  onClick={() => scrollToSection('home')} 
                  className={`font-medium transition-colors duration-300 ${activeSection === 'home' ? 'text-eid-primary' : 'text-gray-600 dark:text-gray-300'}`}
                >
                  Home
                </button>
                <button 
                  onClick={() => scrollToSection('greetings')} 
                  className={`font-medium transition-colors duration-300 ${activeSection === 'greetings' ? 'text-eid-primary' : 'text-gray-600 dark:text-gray-300'}`}
                >
                  Greetings
                </button>
                <button 
                  onClick={() => scrollToSection('card-maker')} 
                  className={`font-medium transition-colors duration-300 ${activeSection === 'card-maker' ? 'text-eid-primary' : 'text-gray-600 dark:text-gray-300'}`}
                >
                  Card Maker
                </button>
                <button 
                  onClick={() => scrollToSection('recipes')} 
                  className={`font-medium transition-colors duration-300 ${activeSection === 'recipes' ? 'text-eid-primary' : 'text-gray-600 dark:text-gray-300'}`}
                >
                  Recipes
                </button>
              </div>
              
              <div className="flex items-center space-x-4">
                <button 
                  onClick={() => setDarkMode(!darkMode)} 
                  className="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors duration-300"
                  aria-label="Toggle dark mode"
                >
                  {darkMode ? (
                    <i className="fas fa-sun text-yellow-400"></i>
                  ) : (
                    <i className="fas fa-moon text-eid-secondary"></i>
                  )}
                </button>
                
                <div className="md:hidden">
                  <button 
                    onClick={() => document.getElementById('mobile-menu').classList.toggle('hidden')}
                    className="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors duration-300"
                    aria-label="Toggle menu"
                  >
                    <i className="fas fa-bars text-gray-600 dark:text-gray-300"></i>
                  </button>
                </div>
              </div>
            </div>
            
            {/* Mobile Menu */}
            <div id="mobile-menu" className="hidden md:hidden bg-white dark:bg-eid-dark shadow-md">
              <div className="px-4 py-3 space-y-2">
                <button 
                  onClick={() => {
                    scrollToSection('home');
                    document.getElementById('mobile-menu').classList.add('hidden');
                  }} 
                  className="block w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-300"
                >
                  Home
                </button>
                <button 
                  onClick={() => {
                    scrollToSection('greetings');
                    document.getElementById('mobile-menu').classList.add('hidden');
                  }} 
                  className="block w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-300"
                >
                  Greetings
                </button>
                <button 
                  onClick={() => {
                    scrollToSection('card-maker');
                    document.getElementById('mobile-menu').classList.add('hidden');
                  }} 
                  className="block w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-300"
                >
                  Card Maker
                </button>
                <button 
                  onClick={() => {
                    scrollToSection('recipes');
                    document.getElementById('mobile-menu').classList.add('hidden');
                  }} 
                  className="block w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-300"
                >
                  Recipes
                </button>
              </div>
            </div>
          </nav>
          
          {/* Main Content */}
          <main className="container mx-auto px-4 pt-20">
            {/* Hero Section */}
            <section id="home" className="min-h-screen flex flex-col items-center justify-center py-10">
              <div className="relative w-full max-w-4xl mx-auto text-center">
                {/* Animated Crescent Moon */}
                <div className="absolute -top-10 right-10 md:right-20 animate-float hidden md:block">
                  <div className="w-20 h-20 bg-eid-accent rounded-full shadow-lg relative overflow-hidden">
                    <div className="absolute w-16 h-16 bg-eid-light dark:bg-eid-dark rounded-full -right-5 -top-5"></div>
                  </div>
                </div>
                
                <h1 className="text-4xl md:text-6xl font-bold font-amiri mb-6">
                  <span className="gradient-text">Eid Mubarak</span>
                </h1>
                
                <p className="text-xl md:text-2xl text-gray-700 dark:text-gray-300 mb-8">
                  May this Eid bring joy, happiness, peace and prosperity to you and your family.
                </p>
                
                <div className="text-lg md:text-xl text-eid-primary font-medium mb-10">
                  From: {fromName}
                </div>
                
                <EidCountdown />
                
                <div className="mt-12 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 max-w-md mx-auto">
                  <h3 className="text-xl font-semibold mb-4 text-gray-800 dark:text-white">Share Your Eid Greetings</h3>
                  <div className="flex flex-col md:flex-row gap-4">
                    <input
                      type="text"
                      value={senderName}
                      onChange={(e) => setSenderName(e.target.value)}
                      placeholder="Enter your name"
                      className="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-eid-primary dark:bg-gray-700 dark:text-white"
                    />
                    <button
                      onClick={generateShareLink}
                      className="px-6 py-2 bg-eid-primary text-white rounded-md hover:bg-opacity-90 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-eid-primary focus:ring-opacity-50"
                    >
                      Generate Link
                    </button>
                  </div>
                </div>
              </div>
            </section>
            
            {/* Greetings Section */}
            <section id="greetings" className="py-16">
              <div className="max-w-4xl mx-auto">
                <h2 className="text-3xl md:text-4xl font-bold font-amiri mb-10 text-center gradient-text">
                  Eid Greetings
                </h2>
                
                <GreetingGenerator />
              </div>
            </section>
            
            {/* Card Maker Section */}
            <section id="card-maker" className="py-16 bg-gray-50 dark:bg-gray-800 rounded-xl">
              <div className="max-w-5xl mx-auto">
                <h2 className="text-3xl md:text-4xl font-bold font-amiri mb-10 text-center gradient-text">
                  Eid Card Maker
                </h2>
                
                <CardMaker />
              </div>
            </section>
            
            {/* Recipes Section */}
            <section id="recipes" className="py-16">
              <div className="max-w-6xl mx-auto">
                <h2 className="text-3xl md:text-4xl font-bold font-amiri mb-10 text-center gradient-text">
                  Eid Recipes
                </h2>
                
                <RecipeCarousel />
              </div>
            </section>
          </main>
          
          {/* Footer */}
          <footer className="bg-eid-dark text-white py-8">
            <div className="container mx-auto px-4 text-center">
              <p className="mb-4">
                <span className="font-amiri text-2xl">عيد مبارك</span>
              </p>
              <p className="text-gray-400">
                Created with ❤️ by UzairDeveloper223 for Eid celebrations
              </p>
            </div>
          </footer>
        </div>
      );
    };
    
    // Eid Countdown Component
    const EidCountdown = () => {
      const [timeLeft, setTimeLeft] = React.useState({
        days: 0,
        hours: 0,
        minutes: 0,
        seconds: 0
      });
      
      React.useEffect(() => {
        // Set Eid date - this should be updated each year
        // Using a sample date for demonstration
        const eidDate = new Date('2025-03-31T00:00:00');
        
        const timer = setInterval(() => {
          const now = new Date();
          const difference = eidDate - now;
          
          if (difference <= 0) {
            clearInterval(timer);
            setTimeLeft({
              days: 0,
              hours: 0,
              minutes: 0,
              seconds: 0
            });
            return;
          }
          
          const days = Math.floor(difference / (1000 * 60 * 60 * 24));
          const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((difference % (1000 * 60)) / 1000);
          
          setTimeLeft({ days, hours, minutes, seconds });
        }, 1000);
        
        return () => clearInterval(timer);
      }, []);
      
      // If Eid has already passed
      if (timeLeft.days === 0 && timeLeft.hours === 0 && timeLeft.minutes === 0 && timeLeft.seconds === 0) {
        return (
          <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 max-w-md mx-auto">
            <h3 className="text-2xl font-bold text-eid-primary mb-2">Eid Mubarak!</h3>
            <p className="text-gray-700 dark:text-gray-300">
              May Allah accept our prayers and bless us all.
            </p>
          </div>
        );
      }
      
      return (
        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 max-w-md mx-auto">
          <h3 className="text-xl font-semibold mb-4 text-gray-800 dark:text-white">Countdown to Eid</h3>
          <div className="grid grid-cols-4 gap-2 text-center">
            <div className="bg-gray-100 dark:bg-gray-700 rounded-lg p-3">
              <div className="text-2xl md:text-3xl font-bold text-eid-primary">{timeLeft.days}</div>
              <div className="text-xs md:text-sm text-gray-600 dark:text-gray-400">Days</div>
            </div>
            <div className="bg-gray-100 dark:bg-gray-700 rounded-lg p-3">
              <div className="text-2xl md:text-3xl font-bold text-eid-secondary">{timeLeft.hours}</div>
              <div className="text-xs md:text-sm text-gray-600 dark:text-gray-400">Hours</div>
            </div>
            <div className="bg-gray-100 dark:bg-gray-700 rounded-lg p-3">
              <div className="text-2xl md:text-3xl font-bold text-eid-accent">{timeLeft.minutes}</div>
              <div className="text-xs md:text-sm text-gray-600 dark:text-gray-400">Minutes</div>
            </div>
            <div className="bg-gray-100 dark:bg-gray-700 rounded-lg p-3">
              <div className="text-2xl md:text-3xl font-bold text-eid-primary">{timeLeft.seconds}</div>
              <div className="text-xs md:text-sm text-gray-600 dark:text-gray-400">Seconds</div>
            </div>
          </div>
        </div>
      );
    };
    
    // Greeting Generator Component
    const GreetingGenerator = () => {
      const greetings = [
        "May the magic of this Eid bring lots of happiness in your life and may you celebrate it with all your close friends and may it fill your heart with love.",
        "May Allah flood your life with happiness on this occasion, your heart with love, your soul with spiritual, your mind with wisdom, wishing you a very Happy Eid.",
        "May Allah's blessings be with you today and always. Eid Mubarak!",
        "May this special day bring peace, happiness and prosperity to everyone. Eid Mubarak!",
        "In every shared smile and the feeling of brotherhood, may Allah bless you with all the joy and prosperity. Eid Mubarak!",
        "May Allah bless you with kindness, patience and love. Eid Mubarak!",
        "Wishing you and your family a very happy and peaceful Eid.",
        "May the divine blessings of Allah bring you hope, faith, and joy on Eid. Eid Mubarak!"
      ];
      
      const [currentGreeting, setCurrentGreeting] = React.useState(0);
      
      const nextGreeting = () => {
        setCurrentGreeting((prev) => (prev + 1) % greetings.length);
      };
      
      const prevGreeting = () => {
        setCurrentGreeting((prev) => (prev - 1 + greetings.length) % greetings.length);
      };
      
      return (
        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 md:p-8 text-center relative">
          <button 
            onClick={prevGreeting}
            className="absolute left-4 top-1/2 transform -translate-y-1/2 w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-300"
            aria-label="Previous greeting"
          >
            <i className="fas fa-chevron-left text-gray-600 dark:text-gray-300"></i>
          </button>
          
          <div className="min-h-[150px] flex items-center justify-center">
            <p className="text-lg md:text-xl text-gray-700 dark:text-gray-300 font-medium italic">
              "{greetings[currentGreeting]}"
            </p>
          </div>
          
          <button 
            onClick={nextGreeting}
            className="absolute right-4 top-1/2 transform -translate-y-1/2 w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-300"
            aria-label="Next greeting"
          >
            <i className="fas fa-chevron-right text-gray-600 dark:text-gray-300"></i>
          </button>
          
          <div className="mt-6">
            <button 
              onClick={nextGreeting}
              className="px-6 py-2 bg-eid-primary text-white rounded-md hover:bg-opacity-90 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-eid-primary focus:ring-opacity-50"
            >
              Generate New Greeting
            </button>
          </div>
        </div>
      );
    };
    
    // Card Maker Component
    const CardMaker = () => {
      const [cardConfig, setCardConfig] = React.useState({
        background: 'bg-gradient-to-r from-eid-primary to-eid-secondary',
        greeting: 'Eid Mubarak',
        message: 'May Allah bless you with happiness and peace',
        font: 'font-amiri',
        recipient: '',
        sender: ''
      });
      
      const backgrounds = [
        'bg-gradient-to-r from-eid-primary to-eid-secondary',
        'bg-gradient-to-r from-eid-secondary to-eid-accent',
        'bg-gradient-to-r from-eid-accent to-eid-primary',
        'bg-gradient-to-br from-emerald-500 to-blue-500',
        'bg-gradient-to-br from-purple-500 to-pink-500',
        'bg-gradient-to-r from-amber-500 to-red-500'
      ];
      
      const fonts = [
        'font-amiri',
        'font-raleway'
      ];
      
      const greetings = [
        'Eid Mubarak',
        'عيد مبارك',
        'Happy Eid',
        'Eid Saeed',
        'Selamat Hari Raya'
      ];
      
      const messages = [
        'May Allah bless you with happiness and peace',
        'Wishing you joy and prosperity on this blessed day',
        'May the magic of Eid bring lots of happiness in your life',
        'May Allah accept your good deeds and forgive your transgressions',
        'May this Eid bring joy and love to your heart and create all the opportunities for success'
      ];
      
      const handleChange = (e) => {
        const { name, value } = e.target;
        setCardConfig(prev => ({
          ...prev,
          [name]: value
        }));
      };
      
      const downloadCard = () => {
        // Create a temporary canvas to render the card
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas dimensions
        canvas.width = 800;
        canvas.height = 600;
        
        // Get the card preview element
        const cardPreview = document.getElementById('card-preview');
        
        // Parse the background gradient
        const bgClass = cardConfig.background;
        let gradient;
        
        if (bgClass.includes('from-eid-primary to-eid-secondary')) {
          gradient = ctx.createLinearGradient(0, 0, 800, 0);
          gradient.addColorStop(0, '#10B981');
          gradient.addColorStop(1, '#8B5CF6');
        } else if (bgClass.includes('from-eid-secondary to-eid-accent')) {
          gradient = ctx.createLinearGradient(0, 0, 800, 0);
          gradient.addColorStop(0, '#8B5CF6');
          gradient.addColorStop(1, '#F59E0B');
        } else if (bgClass.includes('from-eid-accent to-eid-primary')) {
          gradient = ctx.createLinearGradient(0, 0, 800, 0);
          gradient.addColorStop(0, '#F59E0B');
          gradient.addColorStop(1, '#10B981');
        } else if (bgClass.includes('from-emerald-500 to-blue-500')) {
          gradient = ctx.createLinearGradient(0, 0, 800, 0);
          gradient.addColorStop(0, '#10b981');
          gradient.addColorStop(1, '#3b82f6');
        } else if (bgClass.includes('from-purple-500 to-pink-500')) {
          gradient = ctx.createLinearGradient(0, 0, 800, 0);
          gradient.addColorStop(0, '#8b5cf6');
          gradient.addColorStop(1, '#ec4899');
        } else if (bgClass.includes('from-amber-500 to-red-500')) {
          gradient = ctx.createLinearGradient(0, 0, 800, 0);
          gradient.addColorStop(0, '#f59e0b');
          gradient.addColorStop(1, '#ef4444');
        }
        
        // Fill background
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 800, 600);
        
        // Add decorative elements
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.arc(700, 100, 80, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(650, 80, 60, 0, 2 * Math.PI);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // Add text
        ctx.textAlign = 'center';
        
        // Greeting
        ctx.font = cardConfig.font === 'font-amiri' ? 'bold 72px Amiri' : 'bold 72px Raleway';
        ctx.fillStyle = 'white';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.fillText(cardConfig.greeting, 400, 150);
        
        // Message
        ctx.font = cardConfig.font === 'font-amiri' ? '32px Amiri' : '32px Raleway';
        ctx.fillStyle = 'white';
        ctx.shadowBlur = 5;
        
        // Handle text wrapping for message
        const maxWidth = 600;
        const lineHeight = 40;
        const words = cardConfig.message.split(' ');
        let line = '';
        let y = 250;
        
        for (let i = 0; i < words.length; i++) {
          const testLine = line + words[i] + ' ';
          const metrics = ctx.measureText(testLine);
          const testWidth = metrics.width;
          
          if (testWidth > maxWidth && i > 0) {
            ctx.fillText(line, 400, y);
            line = words[i] + ' ';
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, 400, y);
        
        // Recipient
        if (cardConfig.recipient) {
          ctx.font = cardConfig.font === 'font-amiri' ? 'italic 28px Amiri' : 'italic 28px Raleway';
          ctx.fillText(`To: ${cardConfig.recipient}`, 400, 350);
        }
        
        // Sender
        if (cardConfig.sender) {
          ctx.font = cardConfig.font === 'font-amiri' ? 'italic 28px Amiri' : 'italic 28px Raleway';
          ctx.fillText(`From: ${cardConfig.sender}`, 400, 500);
        }
        
        // Convert canvas to image
        const dataUrl = canvas.toDataURL('image/png');
        
        // Create download link
        const link = document.createElement('a');
        link.download = 'eid-card.png';
        link.href = dataUrl;
        link.click();
      };
      
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
          {/* Card Preview */}
          <div className="order-2 md:order-1">
            <div 
              id="card-preview"
              className={`card-preview ${cardConfig.background} ${cardConfig.font} rounded-lg shadow-xl p-8 h-[400px] md:h-[500px] flex flex-col items-center justify-center text-white text-center`}
            >
              <h2 className="text-4xl md:text-5xl font-bold mb-6">{cardConfig.greeting}</h2>
              <p className="text-xl md:text-2xl mb-8">{cardConfig.message}</p>
              
              {cardConfig.recipient && (
                <p className="text-lg italic mt-auto">To: {cardConfig.recipient}</p>
              )}
              
              {cardConfig.sender && (
                <p className="text-lg italic mt-2">From: {cardConfig.sender}</p>
              )}
            </div>
          </div>
          
          {/* Card Controls */}
          <div className="order-1 md:order-2 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
            <h3 className="text-xl font-semibold mb-4 text-gray-800 dark:text-white">Customize Your Card</h3>
            
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                  Background
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {backgrounds.map((bg, index) => (
                    <button
                      key={index}
                      onClick={() => setCardConfig(prev => ({ ...prev, background: bg }))}
                      className={`${bg} h-10 rounded-md ${cardConfig.background === bg ? 'ring-2 ring-offset-2 ring-eid-primary' : ''}`}
                      aria-label={`Background option ${index + 1}`}
                    ></button>
                  ))}
                </div>
              </div>
              
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                  Font
                </label>
                <div className="grid grid-cols-2 gap-2">
                  {fonts.map((font, index) => (
                    <button
                      key={index}
                      onClick={() => setCardConfig(prev => ({ ...prev, font }))}
                      className={`${font} h-10 border dark:border-gray-600 rounded-md flex items-center justify-center ${cardConfig.font === font ? 'bg-eid-primary text-white' : 'bg-white dark:bg-gray-700 text-gray-800 dark:text-white'}`}
                    >
                      {font === 'font-amiri' ? 'Amiri' : 'Raleway'}
                    </button>
                  ))}
                </div>
              </div>
              
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                  Greeting
                </label>
                <select
                  name="greeting"
                  value={cardConfig.greeting}
                  onChange={handleChange}
                  className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-eid-primary dark:bg-gray-700 dark:text-white"
                >
                  {greetings.map((greeting, index) => (
                    <option key={index} value={greeting}>{greeting}</option>
                  ))}
                </select>
              </div>
              
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                  Message
                </label>
                <select
                  name="message"
                  value={cardConfig.message}
                  onChange={handleChange}
                  className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-eid-primary dark:bg-gray-700 dark:text-white"
                >
                  {messages.map((message, index) => (
                    <option key={index} value={message}>{message}</option>
                  ))}
                </select>
              </div>
              
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                  To (Optional)
                </label>
                <input
                  type="text"
                  name="recipient"
                  value={cardConfig.recipient}
                  onChange={handleChange}
                  placeholder="Recipient's name"
                  className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-eid-primary dark:bg-gray-700 dark:text-white"
                />
              </div>
              
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                  From (Optional)
                </label>
                <input
                  type="text"
                  name="sender"
                  value={cardConfig.sender}
                  onChange={handleChange}
                  placeholder="Your name"
                  className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-eid-primary dark:bg-gray-700 dark:text-white"
                />
              </div>
              
              <button
                onClick={downloadCard}
                className="w-full mt-6 px-6 py-3 bg-eid-primary text-white rounded-md hover:bg-opacity-90 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-eid-primary focus:ring-opacity-50 flex items-center justify-center"
              >
                <i className="fas fa-download mr-2"></i>
                Download Card
              </button>
            </div>
          </div>
        </div>
      );
    };
    
    // Recipe Carousel Component
    const RecipeCarousel = () => {
      const recipes = [
        {
          title: "Sheer Khurma",
          description: "A festive vermicelli pudding made with milk, dates, and nuts, traditionally served during Eid celebrations.",
          ingredients: [
            "1 cup vermicelli", "4 cups milk", "1/2 cup sugar", "1/4 cup ghee",
            "1/4 cup chopped dates", "1/4 cup mixed nuts (almonds, pistachios)", 
            "1/4 tsp cardamom powder", "Saffron strands"
          ],
          instructions: [
            "Heat ghee in a pan and fry the vermicelli until golden brown.",
            "Add milk and bring to a boil, then simmer until vermicelli is cooked.",
            "Add sugar, dates, and saffron. Stir well.",
            "Add cardamom powder and nuts. Simmer for 5 more minutes.",
            "Serve hot or cold, garnished with more nuts."
          ]
        },
        {
          title: "Biryani",
          description: "A flavorful rice dish made with aromatic spices, meat, and basmati rice, perfect for Eid celebrations.",
          ingredients: [
            "2 cups basmati rice", "500g meat (chicken or mutton)", "2 onions, sliced",
            "2 tomatoes, chopped", "1/4 cup yogurt", "2 tbsp ginger-garlic paste",
            "2 tsp biryani masala", "1/4 cup mint leaves", "1/4 cup coriander leaves",
            "4 tbsp ghee or oil", "Salt to taste"
          ],
          instructions: [
            "Marinate meat with yogurt, ginger-garlic paste, and spices for 1 hour.",
            "Soak rice for 30 minutes, then parboil with whole spices.",
            "In a heavy-bottomed pot, fry onions until golden brown.",
            "Add marinated meat and cook until tender.",
            "Layer partially cooked rice over the meat.",
            "Sprinkle mint, coriander, and saffron-infused milk.",
            "Cover tightly and cook on low heat for 20 minutes.",
            "Mix gently before serving."
          ]
        },
        {
          title: "Baklava",
          description: "A rich, sweet pastry made of layers of filo filled with chopped nuts and sweetened with syrup or honey.",
          ingredients: [
            "1 package filo dough", "2 cups chopped nuts (walnuts, pistachios)",
            "1 cup butter, melted", "1 tsp ground cinnamon", "1 cup water",
            "1 cup sugar", "1/2 cup honey", "1 tsp vanilla extract", "1 tsp lemon zest"
          ],
          instructions: [
            "Preheat oven to 350°F (175°C).",
            "Mix nuts with cinnamon in a bowl.",
            "Layer 8 sheets of filo dough, brushing each with butter.",
            "Spread a thin layer of nut mixture over the dough.",
            "Repeat layers until all ingredients are used.",
            "Cut into diamond shapes before baking.",
            "Bake for 50 minutes until golden and crisp.",
            "Meanwhile, make syrup by boiling water, sugar, honey, vanilla, and lemon zest.",
            "Pour cooled syrup over hot baklava and let it soak."
          ]
        },
        {
          title: "Seviyaan (Sweet Vermicelli)",
          description: "A simple yet delicious dessert made with roasted vermicelli, milk, and sugar, commonly prepared during Eid.",
          ingredients: [
            "2 cups vermicelli", "2 tbsp ghee", "4 cups milk",
            "1/2 cup sugar", "1/4 cup mixed nuts", "1/4 tsp cardamom powder",
            "Pinch of saffron", "2 tbsp raisins"
          ],
          instructions: [
            "Heat ghee in a pan and roast vermicelli until golden brown.",
            "Add milk and bring to a boil, then simmer for 10-15 minutes.",
            "Add sugar and stir until dissolved.",
            "Add cardamom powder, saffron, and half of the nuts and raisins.",
            "Cook for another 5 minutes until it reaches desired consistency.",
            "Garnish with remaining nuts and raisins before serving."
          ]
        }
      ];
      
      const [currentRecipe, setCurrentRecipe] = React.useState(0);
      
      const nextRecipe = () => {
        setCurrentRecipe((prev) => (prev + 1) % recipes.length);
      };
      
      const prevRecipe = () => {
        setCurrentRecipe((prev) => (prev - 1 + recipes.length) % recipes.length);
      };
      
      return (
        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden">
          <div className="relative">
            <button 
              onClick={prevRecipe}
              className="absolute left-4 top-1/2 transform -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-white dark:bg-gray-700 shadow-md flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors duration-300"
              aria-label="Previous recipe"
            >
              <i className="fas fa-chevron-left text-gray-600 dark:text-gray-300"></i>
            </button>
            
            <div className="p-6 md:p-8">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                  <h3 className="text-2xl font-bold text-eid-primary mb-4">{recipes[currentRecipe].title}</h3>
                  <p className="text-gray-700 dark:text-gray-300 mb-6">{recipes[currentRecipe].description}</p>
                  
                  <h4 className="text-lg font-semibold text-gray-800 dark:text-white mb-2">Ingredients:</h4>
                  <ul className="list-disc pl-5 mb-6 text-gray-700 dark:text-gray-300 space-y-1">
                    {recipes[currentRecipe].ingredients.map((ingredient, index) => (
                      <li key={index}>{ingredient}</li>
                    ))}
                  </ul>
                </div>
                
                <div>
                  <h4 className="text-lg font-semibold text-gray-800 dark:text-white mb-2">Instructions:</h4>
                  <ol className="list-decimal pl-5 text-gray-700 dark:text-gray-300 space-y-2">
                    {recipes[currentRecipe].instructions.map((instruction, index) => (
                      <li key={index} className="mb-2">{instruction}</li>
                    ))}
                  </ol>
                </div>
              </div>
              
              <div className="mt-8 flex justify-center">
                {recipes.map((_, index) => (
                  <button
                    key={index}
                    onClick={() => setCurrentRecipe(index)}
                    className={`w-3 h-3 rounded-full mx-1 ${currentRecipe === index ? 'bg-eid-primary' : 'bg-gray-300 dark:bg-gray-600'}`}
                    aria-label={`Go to recipe ${index + 1}`}
                  ></button>
                ))}
              </div>
            </div>
            
            <button 
              onClick={nextRecipe}
              className="absolute right-4 top-1/2 transform -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-white dark:bg-gray-700 shadow-md flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors duration-300"
              aria-label="Next recipe"
            >
              <i className="fas fa-chevron-right text-gray-600 dark:text-gray-300"></i>
            </button>
          </div>
        </div>
      );
    };
    
    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
